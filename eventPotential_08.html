            body {
                margin: 0;
                padding: 0;
                font-family: "Noto Sans TC", sans-serif;
                overflow: hidden;
            }

            .slide {
                width: 100%;
                min-height: 720px;
                position: relative;
                background: linear-gradient(120deg, #f9f9f9, #f0f8ff);
                overflow: hidden;
            }

            .gradient-bg {
                background: linear-gradient(135deg, #ff9966, #ff6b6b, #9370db, #6a5acd);
                background-size: 400% 400%;
                /* animation: gradient 15s ease infinite; */
            }

            @keyframes gradient {
                0% {
                    background-position: 0% 50%;
                }
                50% {
                    background-position: 100% 50%;
                }
                100% {
                    background-position: 0% 50%;
                }
            }

            .pulse {
                margin-top: 15px;
                animation: pulse 2s infinite;
            }

            @keyframes pulse {
                0% {
                    transform: scale(1);
                }
                50% {
                    transform: scale(1.05);
                }
                100% {
                    transform: scale(1);
                }
            }
